# Online scan-side feature extraction defaults for GIS LAS replay.
# These values follow the GIS map-tuning file from generalize_static_feature_ws,
# with floor alignment disabled because /lidar_pose already places scans in map.

use_downsample: 0
downsample_size: 0.05

use_floor_align: 0
floor_z_percentile: 10.0
floor_ransac_thresh: 0.05
floor_ransac_iters: 1000

voxel_size: 0.2
n_voxel_min: 3
n_pillar_min: 3

use_voxel_filter: 0
voxel_s_thresh: 0.25

simulate_no_ceiling: 0
ceiling_cut_percentile: 18.0

use_span_filter: 1
H_min_voxel: 0
fill_ratio_thresh: 0.4
horiz_normal_thresh: 0.9

use_floor_height_filter: 0
floor_height_radius: 5
floor_height_max: 0.7

# pillar내 복셀 normal의 xy평면과의 평행 유무를 통한 동적 객체 제거 로직
# 차량 벽면 제거를 위함
use_phi_weight: 0     # 복셀 내 포인트 수에 따라 phi_mean/std 가중치 적용
phi_mean_thresh: 0.4
phi_std_thresh: 0.4

# s_thresh: 0.0005
s_thresh: 0.0015

# Pillar 내 복셀들의 normal 경향성을 통한 feature 분류
use_weight: 1        # n_bar 및 theta mean/std에 복셀 포인트 수 기반 가중치 적용
n_ref: 50.0           # 복셀 내 포인트가 이 값이면 weight ≈ 0.95
# mu_thresh: 0.4        # 라디안
# sigma_thresh: 0.45     # 라디안
mu_thresh: 0.5        # 라디안
sigma_thresh: 0.5     # 라디안

use_voxel_corner: 1
corner_multiplier: 15.0
use_corner_downsample: 0

# Planar(surface) feature voxel-filter 다운샘플 (KD-Tree 입력용, LSMCL 수식 17 관점)
# corner는 손대지 않고 planar 점만 voxel당 centroid 1점으로 축약.
# per-window(merge 전) 적용이라 작은 leaf(≤0.05m)에서도 VoxelGrid 오버플로 없음.
use_planar_downsample: 1     # 0/1 기능 on/off
planar_leaf: 0.1            # [m] surface 다운샘플 복셀 크기 (예: 5cm)

# Corner distance-spacing 다운샘플 (LSMCL Eq.3 d_c와 동일)
# 출력 _corner_edge.pcd: 선별 anchor(파랑=CORNER, 빨강=VOXEL_CORNER)
#   + 인접 anchor(서로 1.5×spacing 이내)를 잇는 초록 세그먼트
# anchor끼리 항상 corner_spacing 이상 떨어지도록 greedy 선별(strict ≥ d).
use_corner_edge: 0           # 0/1 기능 on/off
corner_spacing: 0.1          # [m] anchor distance-spacing 간격

# Coordinate convention.
# The PCD map in /home/rain/data/국토부_GIS_map/pcd_map was generated with
# local_origin_mode=first, so online scan features subtract the same first LAS
# point after applying /lidar_pose.
local_origin_mode: las_first
origin_las_path: /home/rain/data/국토부_GIS_map/20250730072521533_gps_sorted.las

# Accumulated colored online feature map.
publish_feature_history: false
feature_history_topic: feature_map_colored
save_on_shutdown_pcd: true
save_feature_history_path: /home/rain/online_static_feature_ws/output/pcd_map/online_static_features_20cm복셀.pcd
max_feature_history_points: 200000000
